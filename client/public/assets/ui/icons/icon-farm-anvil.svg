<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Runic Forge Anvil & Hammer / Farm Automation -->
  <defs>
    <linearGradient id="ironAnvil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="anvilGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
  </defs>
  <!-- Anvil Base -->
  <path d="M8 27 L24 27 L22 23 L10 23 Z" fill="url(#ironAnvil)" stroke="url(#anvilGold)" stroke-width="1"/>
  <!-- Anvil Waist -->
  <path d="M12 23 L20 23 L19 16 L13 16 Z" fill="url(#ironAnvil)" stroke="#334155" stroke-width="1"/>
  <!-- Anvil Top Horn & Face -->
  <path d="M5 13 C7 13 10 14 12 16 L25 16 C27 16 28 15 28 13 L27 10 L7 10 Z" fill="url(#ironAnvil)" stroke="url(#anvilGold)" stroke-width="1.3"/>
  <!-- Runic Engraving on Anvil -->
  <path d="M14 13 L18 13 M16 11 L16 15" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
  <!-- War Hammer Crossed Behind Anvil -->
  <path d="M22 4 L28 10" stroke="#78350f" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="23" y="3" width="7" height="4" rx="1" transform="rotate(45 23 3)" fill="#475569" stroke="url(#anvilGold)" stroke-width="0.8"/>
  <!-- Magic Farm Sparks / Infinity Glow -->
  <circle cx="16" cy="7" r="2.2" fill="url(#sparkGlow)"/>
  <path d="M16 2 L16 12 M11 7 L21 7" stroke="#fef08a" stroke-width="1" stroke-linecap="round"/>
  <circle cx="21" cy="4" r="0.9" fill="#fde68a"/>
  <circle cx="11" cy="4" r="0.9" fill="#fde68a"/>
</svg>
