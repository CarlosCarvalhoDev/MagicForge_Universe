<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Sapphire Mana Potion Flask -->
  <defs>
    <radialGradient id="mpLiquid" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <linearGradient id="flaskGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Cork Stopper -->
  <rect x="10" y="2" width="4" height="3" rx="0.8" fill="#92400e" stroke="#451a03" stroke-width="0.8"/>
  <!-- Neck -->
  <path d="M9.5 5 L14.5 5 L13.5 9 L10.5 9 Z" fill="#38bdf8" stroke="url(#flaskGold)" stroke-width="0.8" opacity="0.8"/>
  <!-- Spherical Flask Body -->
  <circle cx="12" cy="15" r="7" fill="url(#mpLiquid)" stroke="url(#flaskGold)" stroke-width="1.2"/>
  <!-- Glass Highlight -->
  <path d="M8 12 A 5 5 0 0 1 12 9.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <!-- Energy Drop Glyph in Liquid -->
  <path d="M12 11.5 C12 11.5 10 13.8 10 15 C10 16.1 10.9 17 12 17 C13.1 17 14 16.1 14 15 C14 13.8 12 11.5 12 11.5 Z" fill="#ffffff" opacity="0.6"/>
</svg>
