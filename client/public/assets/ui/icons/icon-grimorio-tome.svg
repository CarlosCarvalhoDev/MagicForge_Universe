<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Arcane Spellbook Tome / Grimório -->
  <defs>
    <linearGradient id="tomeCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="60%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tomeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="gemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
  </defs>
  <!-- Book Back & Pages Edge -->
  <path d="M5 26 L24 28 L27 26 L27 7 L24 9 L5 7 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <!-- Book Cover Front -->
  <path d="M7 6 L25 4 C26 4 27 5 27 6 L27 24 C27 25 26 26 25 26 L7 28 Z" fill="url(#tomeCover)" stroke="url(#tomeGold)" stroke-width="1.3"/>
  <!-- Spine Ribs -->
  <path d="M7 6 L5 7 L5 29 L7 28 Z" fill="#1e1b4b" stroke="url(#tomeGold)" stroke-width="1"/>
  <line x1="5" y1="12" x2="7" y2="11.5" stroke="url(#tomeGold)" stroke-width="1.2"/>
  <line x1="5" y1="17" x2="7" y2="16.5" stroke="url(#tomeGold)" stroke-width="1.2"/>
  <line x1="5" y1="22" x2="7" y2="21.5" stroke="url(#tomeGold)" stroke-width="1.2"/>
  <!-- Corner Ornaments -->
  <path d="M9 8 L14 7 L9 13 Z" fill="url(#tomeGold)"/>
  <path d="M23 6 L18 7 L23 11 Z" fill="url(#tomeGold)"/>
  <path d="M9 26 L14 26 L9 21 Z" fill="url(#tomeGold)"/>
  <path d="M23 24 L18 24 L23 20 Z" fill="url(#tomeGold)"/>
  <!-- Center Runic Eye / Sigil -->
  <circle cx="16" cy="16" r="5" stroke="url(#tomeGold)" stroke-width="1.2" stroke-dasharray="2 1.5"/>
  <polygon points="16,11 19.5,16 16,21 12.5,16" fill="url(#gemGlow)" stroke="#fef08a" stroke-width="0.8"/>
  <circle cx="16" cy="16" r="1.2" fill="#fff"/>
</svg>
