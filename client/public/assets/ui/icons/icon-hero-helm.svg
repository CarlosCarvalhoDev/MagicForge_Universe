<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Knight Helm / Hero Icon -->
  <defs>
    <linearGradient id="goldHelm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="steelHelm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Crest Feather / Crown -->
  <path d="M16 2 C18 5 21 6 22 9 C20 9 18 8 16 7 C14 8 12 9 10 9 C11 6 14 5 16 2 Z" fill="url(#goldHelm)"/>
  <!-- Helmet Dome -->
  <path d="M7 12 C7 7 11 5 16 5 C21 5 25 7 25 12 C25 16 24 22 22 26 L10 26 C8 22 7 16 7 12 Z" fill="url(#steelHelm)" stroke="#d97706" stroke-width="1.2"/>
  <!-- Visor Plate -->
  <path d="M9 13 L23 13 L22 19 L16 21 L10 19 Z" fill="#0f172a" stroke="url(#goldHelm)" stroke-width="1"/>
  <!-- Eye Slits -->
  <line x1="11" y1="16" x2="14.5" y2="16" stroke="#fde68a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="17.5" y1="16" x2="21" y2="16" stroke="#fde68a" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Vent Holes -->
  <circle cx="13" cy="22" r="0.8" fill="#fde68a"/>
  <circle cx="16" cy="23" r="0.8" fill="#fde68a"/>
  <circle cx="19" cy="22" r="0.8" fill="#fde68a"/>
  <!-- Neck Guard -->
  <path d="M9 26 L23 26 L24 29 L8 29 Z" fill="url(#steelHelm)" stroke="#d97706" stroke-width="1"/>
</svg>
