<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="haloGold" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <!-- Outer Runic Ring -->
  <circle cx="120" cy="120" r="112" stroke="url(#haloGold)" stroke-width="1.6" stroke-opacity="0.55"/>
  <circle cx="120" cy="120" r="104" stroke="#FDE68A" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.45"/>
  <circle cx="120" cy="120" r="92" stroke="url(#haloGold)" stroke-width="1.4" stroke-opacity="0.5"/>
  <!-- Octagram Geometric Star -->
  <rect x="44" y="44" width="152" height="152" stroke="#FBBF24" stroke-width="0.9" stroke-opacity="0.32"/>
  <rect x="44" y="44" width="152" height="152" transform="rotate(45 120 120)" stroke="#FBBF24" stroke-width="0.9" stroke-opacity="0.32"/>
  <!-- Cardinal Runic Nodes -->
  <polygon points="120,2 125,10 120,18 115,10" fill="#FDE68A"/>
  <polygon points="120,222 125,230 120,238 115,230" fill="#FDE68A"/>
  <polygon points="2,120 10,125 18,120 10,115" fill="#FDE68A"/>
  <polygon points="222,120 230,125 238,120 230,115" fill="#FDE68A"/>
  <!-- Diagonal Nodes -->
  <circle cx="41" cy="41" r="3" fill="#F59E0B" stroke="#FEF08A" stroke-width="1"/>
  <circle cx="199" cy="41" r="3" fill="#F59E0B" stroke="#FEF08A" stroke-width="1"/>
  <circle cx="41" cy="199" r="3" fill="#F59E0B" stroke="#FEF08A" stroke-width="1"/>
  <circle cx="199" cy="199" r="3" fill="#F59E0B" stroke="#FEF08A" stroke-width="1"/>
</svg>

