<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" fill="none">
  <defs>
    <linearGradient id="goldOuter" x1="0" y1="0" x2="400" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="25%" stop-color="#FBBF24"/>
      <stop offset="55%" stop-color="#B45309"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="goldBright" x1="0" y1="0" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <radialGradient id="gemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Chamfered Frame -->
  <path d="M24 4 H376 L396 24 V496 L376 516 H24 L4 496 V24 Z" stroke="url(#goldOuter)" stroke-width="2.5" fill="none"/>
  <!-- Inner Stepped Frame -->
  <path d="M30 11 H370 L389 30 V490 L370 509 H30 L11 490 V30 Z" stroke="url(#goldBright)" stroke-width="1" stroke-opacity="0.65" fill="none"/>
  <!-- Deep Inner Hairline -->
  <rect x="16" y="16" width="368" height="488" rx="2" stroke="#FBBF24" stroke-width="0.6" stroke-opacity="0.28" fill="none"/>

  <!-- TOP-LEFT ORNATE CORNER FILIGREE -->
  <g stroke="url(#goldBright)" stroke-width="1.8" fill="#0B0F1C">
    <path d="M4 42 V20 L20 4 H42 L34 12 H22 L12 22 V34 Z"/>
    <path d="M11 56 V28 L28 11 H56" stroke-width="1.4" fill="none"/>
    <polygon points="20,20 26,16 30,20 26,26 20,30 16,26" fill="#F59E0B" stroke="#FEF08A" stroke-width="1"/>
    <circle cx="48" cy="11" r="2.2" fill="#FEF08A"/>
    <circle cx="11" cy="48" r="2.2" fill="#FEF08A"/>
  </g>

  <!-- TOP-RIGHT ORNATE CORNER FILIGREE -->
  <g stroke="url(#goldBright)" stroke-width="1.8" fill="#0B0F1C" transform="translate(400, 0) scale(-1, 1)">
    <path d="M4 42 V20 L20 4 H42 L34 12 H22 L12 22 V34 Z"/>
    <path d="M11 56 V28 L28 11 H56" stroke-width="1.4" fill="none"/>
    <polygon points="20,20 26,16 30,20 26,26 20,30 16,26" fill="#F59E0B" stroke="#FEF08A" stroke-width="1"/>
    <circle cx="48" cy="11" r="2.2" fill="#FEF08A"/>
    <circle cx="11" cy="48" r="2.2" fill="#FEF08A"/>
  </g>

  <!-- BOTTOM-LEFT ORNATE CORNER FILIGREE -->
  <g stroke="url(#goldBright)" stroke-width="1.8" fill="#0B0F1C" transform="translate(0, 520) scale(1, -1)">
    <path d="M4 42 V20 L20 4 H42 L34 12 H22 L12 22 V34 Z"/>
    <path d="M11 56 V28 L28 11 H56" stroke-width="1.4" fill="none"/>
    <polygon points="20,20 26,16 30,20 26,26 20,30 16,26" fill="#F59E0B" stroke="#FEF08A" stroke-width="1"/>
    <circle cx="48" cy="11" r="2.2" fill="#FEF08A"/>
    <circle cx="11" cy="48" r="2.2" fill="#FEF08A"/>
  </g>

  <!-- BOTTOM-RIGHT ORNATE CORNER FILIGREE -->
  <g stroke="url(#goldBright)" stroke-width="1.8" fill="#0B0F1C" transform="translate(400, 520) scale(-1, -1)">
    <path d="M4 42 V20 L20 4 H42 L34 12 H22 L12 22 V34 Z"/>
    <path d="M11 56 V28 L28 11 H56" stroke-width="1.4" fill="none"/>
    <polygon points="20,20 26,16 30,20 26,26 20,30 16,26" fill="#F59E0B" stroke="#FEF08A" stroke-width="1"/>
    <circle cx="48" cy="11" r="2.2" fill="#FEF08A"/>
    <circle cx="11" cy="48" r="2.2" fill="#FEF08A"/>
  </g>

  <!-- TOP CENTER RUNIC CROWN CLASP -->
  <g transform="translate(200, 8)">
    <path d="M-58 3 L-24 3 L-14 -4 L0 -6 L14 -4 L24 3 L58 3 L46 8 L-46 8 Z" fill="#0D1222" stroke="url(#goldBright)" stroke-width="1.4"/>
    <polygon points="0,-5 7,2 0,9 -7,2" fill="#FBBF24" stroke="#FEF08A" stroke-width="1"/>
    <polygon points="-28,3 -23,0 -18,3 -23,6" fill="#D97706"/>
    <polygon points="28,3 23,0 18,3 23,6" fill="#D97706"/>
  </g>

  <!-- BOTTOM CENTER RUNIC CLASP -->
  <g transform="translate(200, 512) scale(1, -1)">
    <path d="M-48 3 L-20 3 L-10 -3 L0 -5 L10 -3 L20 3 L48 3 L38 7 L-38 7 Z" fill="#0D1222" stroke="url(#goldBright)" stroke-width="1.3"/>
    <polygon points="0,-4 5,1 0,6 -5,1" fill="#FBBF24" stroke="#FEF08A" stroke-width="0.9"/>
  </g>

  <!-- LEFT & RIGHT MIDPOINT RUNIC CLASPS -->
  <g transform="translate(7, 260)">
    <path d="M0 -36 L6 -24 V24 L0 36 L-3 24 V-24 Z" fill="#0D1222" stroke="url(#goldBright)" stroke-width="1.2"/>
    <polygon points="2,-6 6,0 2,6 -2,0" fill="#FBBF24"/>
  </g>
  <g transform="translate(393, 260) scale(-1, 1)">
    <path d="M0 -36 L6 -24 V24 L0 36 L-3 24 V-24 Z" fill="#0D1222" stroke="url(#goldBright)" stroke-width="1.2"/>
    <polygon points="2,-6 6,0 2,6 -2,0" fill="#FBBF24"/>
  </g>
</svg>

